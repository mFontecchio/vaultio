name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Scanner / pricing / grading / update requests
        should note offline vs online expectations.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner
        - Collection
        - Wishlist
        - Pricing / market data
        - Set downloads / catalog
        - Stats
        - AI grading
        - Settings / theme
        - In-app updates
        - Navigation / onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point or gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Vaultio behave if this ships?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or apps you’ve tried.
    validations:
      required: false
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity expectation
      options:
        - Works fully offline after catalog download
        - Needs network for this feature
        - Hybrid / not sure
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I understand AI grading estimates are not a substitute for PSA/BGS
          required: false
